<style>
:root{--bg:#12101c;--pn:#1d1a30;--pn2:#2a2644;--tx:#f2ead8;--mu:#a59fc0;--ac:#f4b942;--ln:#3a3560;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4efe3;--pn:#fffaf0;--pn2:#efe6d2;--tx:#231d33;--mu:#6b6486;--ac:#c47d00;--ln:#d8ccb0;color-scheme:light}}
:root[data-theme="light"]{--bg:#f4efe3;--pn:#fffaf0;--pn2:#efe6d2;--tx:#231d33;--mu:#6b6486;--ac:#c47d00;--ln:#d8ccb0;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,var(--pn2),var(--bg));color:var(--tx);font:700 15px/1.45 Nunito,"Trebuchet MS",system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:"Alfa Slab One",Georgia,serif;font-weight:400;margin:0;letter-spacing:.5px}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:980px;margin:0 auto;padding:16px}
.btn{background:var(--pn);border:2px solid var(--ln);border-radius:12px;padding:10px 16px;transition:.15s}
.btn:hover:not(:disabled){transform:translateY(-2px);border-color:var(--ac)}
.btn.pri{background:var(--ac);color:#1a1424;border-color:var(--ac)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hero{text-align:center;padding:28px 0 8px}
.hero h1{font-size:clamp(34px,8vw,62px);line-height:1}
.hero p{color:var(--mu);margin:8px 0 0}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:18px 0}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:640px;margin:20px auto}
.menu .btn{padding:16px;text-align:left}.menu small{display:block;color:var(--mu);font-weight:500}
.lineup{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:18px}
.lineup .stage{transform:scale(.55);margin:-40px -22px -50px}
.panel{background:var(--pn);border:2px solid var(--ln);border-radius:16px;padding:16px;margin:12px 0}
label{display:block;color:var(--mu);margin:8px 0 4px}
input[type=text]{width:100%;background:var(--bg);border:2px solid var(--ln);border-radius:10px;padding:10px;color:var(--tx);font:inherit}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg .btn.on{border-color:var(--ac);background:var(--pn2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border-left:6px solid var(--c,#888)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.card{background:var(--pn);border:2px solid var(--ln);border-top:6px solid var(--c);border-radius:14px;padding:14px}
.card ul{margin:8px 0 0;padding-left:18px;font-weight:500}
.card .stage{transform:scale(.7);margin:-20px auto -30px}
/* characters */
.stage{position:relative;width:120px;height:150px;margin:0 auto}
.ch{position:absolute;inset:0;animation:bob 2.2s ease-in-out infinite}
.head{position:absolute;left:36px;top:6px;width:48px;height:48px;border-radius:50%;background:#f1d3b3;border:3px solid #0003;display:flex;gap:10px;align-items:center;justify-content:center}
.head i{width:6px;height:9px;background:#201a2e;border-radius:3px;animation:blink 4s infinite}
.head::before{content:"";position:absolute;left:-4px;right:-4px;top:-5px;height:24px;border-radius:24px 24px 4px 4px;background:var(--c);filter:brightness(.8)}
.body{position:absolute;left:28px;top:56px;width:64px;height:62px;border-radius:14px 14px 8px 8px;background:var(--c);border:3px solid #0003;display:grid;place-items:center;font-size:26px}
.body::before,.body::after{content:"";position:absolute;top:6px;width:14px;height:44px;border-radius:8px;background:var(--c);filter:brightness(.85);border:3px solid #0003}
.body::before{left:-17px}.body::after{right:-17px}
.legs{position:absolute;left:36px;top:116px;width:48px;height:22px;background:linear-gradient(90deg,#241d38 45%,transparent 45% 55%,#241d38 55%);border-radius:0 0 8px 8px}
.sh{position:absolute;left:20px;right:20px;bottom:0;height:12px;border-radius:50%;background:#0005;filter:blur(3px)}
.ch.hit{animation:hit .45s}.ch.heal{animation:heal .7s}.ch.dodge{animation:dodge .5s}.ch.parry{animation:parry .55s}
.art{width:100%;height:100%;overflow:visible;display:block}.pc{fill:var(--c)}.pd{fill:var(--c);filter:brightness(.7)}
#ub .art{transform:scaleX(-1)}
.kg{display:none}.und .kg{display:inline}.ch.und{filter:drop-shadow(0 0 10px #b66cff)}.ch.und .art{scale:1.12}.ch.bz{filter:drop-shadow(0 0 12px #ff4b2b)}
.core{animation:glow 1.2s infinite alternate}@keyframes glow{to{opacity:.5}}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;padding-top:8px}
.pk{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 6px 8px;border-top:5px solid var(--c)}
.pk b{font:400 13px "Alfa Slab One",serif}.pk small{color:var(--mu);font-weight:500;font-size:11px}
.pk.on{background:var(--pn2);border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 6px 18px #0005;transform:translateY(-3px)}
.mini{width:70px;height:88px}.mini .art{height:100%}.dice{display:grid;place-items:center;height:88px;font-size:40px}
.bd{position:absolute;top:-10px;right:-6px;font-style:normal;background:var(--ac);color:#1a1424;border-radius:10px;padding:0 8px;font-size:12px}
.lore{color:var(--mu);font-weight:500;margin:10px 0 0}.q{font-style:italic;margin:6px 0 0}
.who{display:flex;gap:8px;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:3px solid var(--c)}.who .pt{font-size:22px}
#acts .btn{border-left:6px solid var(--c,var(--ln))}#acts .btn.stop{border-style:dashed;border-left-style:solid;opacity:.85}
.mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:20;padding:6px 10px}
/* battle */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;margin:10px 0;padding:14px 8px;border-radius:18px;border:2px solid var(--ln);background:linear-gradient(180deg,#0000 55%,#0003),radial-gradient(500px 200px at 50% 100%,var(--pn2),var(--pn))}
.vs{font-family:"Alfa Slab One",serif;color:var(--ac);font-size:22px;padding-bottom:70px}
.u{position:relative;min-width:0;opacity:.8;transition:.25s}.u.act{opacity:1}.u.act .nm b{color:var(--ac)}
.u.atk{animation:lungeA .5s}#ub.atk{animation:lungeB .5s}
.nm{text-align:center}.nm small{color:var(--mu);margin-left:6px}
.tg{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:22px;margin:2px 0}
.tg em{font-style:normal;font-size:12px;background:var(--ac);color:#1a1424;border-radius:8px;padding:0 7px}
.bars{display:grid;gap:5px;margin-top:6px}
.br{display:grid;grid-template-columns:54px 1fr 58px;gap:6px;align-items:center;font-size:12px;color:var(--mu)}
.br span:last-child{text-align:right;color:var(--tx)}
.tr{height:12px;background:var(--bg);border:2px solid var(--ln);border-radius:8px;overflow:hidden}
.fi{height:100%;width:0;border-radius:6px;transition:width .5s cubic-bezier(.3,.8,.3,1),background .3s;background-repeat:no-repeat}
.br.hp{font-size:13px}.br.hp .tr{height:16px}
.say{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);border-radius:12px;padding:3px 10px;font-size:12px;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis;animation:pop .3s}
.fl{position:absolute;top:30px;font:400 26px "Alfa Slab One",serif;pointer-events:none;animation:rise 1.1s forwards;text-shadow:0 2px 0 #000a}
.fl.hit{color:#ff5d5d}.fl.heal{color:#66e08a}.fl.dodge{color:#9ad}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
#acts .btn{text-align:left;padding:8px 12px}#acts small{display:block;font-weight:500;color:var(--mu)}
#log{height:170px;overflow:auto;font-weight:500;font-size:13px;display:flex;flex-direction:column;gap:2px}
#log p{margin:0;animation:pop .25s}.l-a{color:var(--ac)}.l-g{color:#66e08a}.l-r{color:#ff7a7a}.l-m{color:var(--mu)}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:9;padding:16px}
.modal .card{max-width:440px;width:100%;text-align:center;border-top-color:var(--ac);animation:pop .3s}
.modal .opts{display:grid;gap:8px;margin-top:12px}
@media(max-width:640px){.cols{grid-template-columns:1fr}.arena{grid-template-columns:1fr 1fr}.vs{display:none}.stage{transform:scale(.8);margin:-12px auto -18px}.br{grid-template-columns:46px 1fr 50px}}
@keyframes bob{50%{transform:translateY(-5px)}}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes lungeA{40%{transform:translateX(70px) scale(1.06)}}@keyframes lungeB{40%{transform:translateX(-70px) scale(1.06)}}
@keyframes hit{0%{filter:brightness(3) saturate(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}}
@keyframes heal{0%,100%{filter:none}40%{filter:drop-shadow(0 0 14px #66e08a) brightness(1.3)}}
@keyframes parry{0%{filter:brightness(2.4) drop-shadow(0 0 18px #ffb347);transform:scale(1.1) translateY(-4px)}30%{transform:scale(.95)}60%{filter:brightness(1.2) drop-shadow(0 0 10px #ffb347)}to{filter:none;transform:none}}
.pry{position:absolute;left:50%;top:48%;width:0;height:0;pointer-events:none;z-index:6}
.pry .rg{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border:4px solid #ffd36b;border-radius:50%;box-shadow:0 0 14px #ff9a3d,inset 0 0 10px #ffb347;animation:pryr .5s ease-out forwards}
.pry .sl{position:absolute;left:-46px;top:-2px;width:92px;height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff,transparent);transform:rotate(-35deg);animation:pryl .35s ease-out forwards}
.pry .sp{position:absolute;left:-3px;top:-6px;width:6px;height:12px;border-radius:3px;background:#ffe9a8;box-shadow:0 0 6px #ffb347;animation:prys .5s ease-out forwards}
@keyframes pryr{from{transform:scale(.3);opacity:1}to{transform:scale(2.3);opacity:0}}
@keyframes pryl{0%{scale:.2 1;opacity:1}40%{scale:1 1;opacity:1}to{scale:1.1 .3;opacity:0}}
@keyframes prys{from{transform:rotate(var(--a)) translateY(-12px);opacity:1}to{transform:rotate(var(--a)) translateY(-58px) scaleY(.3);opacity:0}}
@keyframes dodge{40%{transform:translateX(26px) skewX(-12deg);opacity:.5}}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}@keyframes pop{from{transform:scale(.8);opacity:0}}

const art=(c,emo)=>`<svg class="art" viewBox="0 0 120 150" aria-hidden="true">${(ART[c]||ART.Simple).replace("EMO",emo||"")}</svg>`;
function charHTML(c,col,emo){return`<div class="stage" style="--c:${col||CLS[c].c}"><div class="ch">${art(c,emo)}</div><div class="sh"></div></div>`}

/* ===== combat core ===== */
const HEALX=1.5;
function healF(f,n){if(f.fb>0&&n>0)n+=f.fb;if(f.boss&&f.pw)n=n*f.pw;if(!f.boss&&!f.simple)n=n*HEALX;n=Math.floor(n);const b=f.hp;f.hp=cl(f.hp+n,0,f.maxHp);fx(f,"heal",f.hp-b);return n}
function hit(a,d,base,o={}){let crit=false;base=Math.floor(base*(a.weak?.9:1));
 if(o.res&&a.cls==="Titankin"&&chance(.3)){base=Math.floor(base*1.5);crit=true}
 if(o.cr&&chance(o.cr[0])){base=Math.floor(base*o.cr[1]);crit=true}
 if(crit){sfx("crit");L(`💥 Critical! ${a.name} hits for ${base}`,"a")}
 if(!crit&&d.cls==="Emanator"&&!d.bz&&chance(.20)){const n=Math.floor(R(10,20)*hm(d)*HEALX),b=d.hp;d.hp=cl(d.hp+n,0,d.maxHp);d.core=cl(d.core+1,0,10);fx(d,"parry");parryFx(d);const u=$("#u"+d.side);if(u){const e=document.createElement("b");e.className="fl heal";e.textContent="PARRY +"+(d.hp-b)+" HP";e.style.left="15%";u.appendChild(e);setTimeout(()=>e.remove(),1100)}L(`🛡️ ${d.name} took the hit, parried it, healed ${d.hp-b} and gained +1 Core!`,"g");return 0}
 if(!crit&&o.res){
  if(d.cls==="Archer"&&chance(.2)){fx(d,"dodge","miss");L(`🌀 ${d.name} sidestepped!`);return 0}
  if(d.cls==="Titankin"&&chance(.3)){fx(d,"dodge","parry");L(`✨ ${d.name} parried!`);return 0}}
 if(!(d.imm>0))L(`${a.name} deals ${base} to ${d.name}`,"r");return recv(d,base,a)}
function recv(d,n,a,follow){if(a&&a.fb>0&&n>0)n+=a.fb;if(d.imm>0&&n>0){d.imm--;fx(d,"dodge","immune");L(`🛡️ ${d.name}’s Overclock blocks the hit (${d.imm} left)`,"g");if(d.imm<=0){d.flat=0;L("Overclock shield broken.","m")}return 0}if(d.red>0)n=Math.floor(n*.6);if(d.rm&&d.rm.red)n=Math.floor(n*(1-d.rm.red));d.hp=Math.max(0,d.hp-n);fx(d,"hit",n);if(d.boss){d.dt=(d.dt||0)+n;if(d.ls>0&&a&&!a.boss)healF(a,Math.max(1,Math.floor(n*(d.lsr||.7)*hm(a))))}
 if(d.cls==="Demigod"){d.ch=cl(d.ch+n,0,d.chMax);if(!d.und&&d.ch>=d.chMax)ascend(d)}
 if(d.cls==="Emanator"&&!d.bz&&n>0&&a){d.core=cl(d.core+1,0,10)}
 if(d.cls==="Trickster"&&!follow){d.stolen=cl(d.stolen+Math.floor(n*.33),0,50);
  if(d.stolen>=50&&a&&a.hp>0&&d.hp>0){d.stolen=0;const x=Math.floor(R(38,48)*dm(d)*(1+((d.rm&&d.rm.ctr)||0)));sfx("coin");try{fly(pos(d),pos(a),"🪙",7);setTimeout(()=>coinBoom(a),380)}catch(e){}L(`🎭 ${d.name} unleashes stolen damage: ${x}!`,"a");d.coins=cl(d.coins+1,0,9);recv(a,x,d,true)}}
 return n}
function ascend(f){const m=hpm(f);f.und=true;f.maxHp=Math.floor(480*m);f.hp=cl(f.hp+Math.floor(300*m),0,f.maxHp);f.en=65;f.ch=0;f.chMax=Math.floor(800*m);sfx("ascend");banner("THE UNDYING KING","#b66cff");flash("#b66cff");L(`👑 ${f.name} ASCENDS into the Undying King!`,"a");say(f,TALK("Demigod","ult"))}

/* ===== actions list per class: [id,label,sub,enabled] ===== */
function lvD(n){return[0,20,130,350,500,730,999][Math.min(6,n)]}
function acts(f){const c=f.cls,A=[],a=(i,l,s,ok=true)=>A.push([i,l,s,ok]);
 if(c==="Titankin"){const e=f.enh;
  a("attack",e?"Enhanced Attack":"Attack",e?"×2 dmg · heal 22":"17–29 · +15 en");
  a("skill",e?"Enhanced Skill":"Skill",f.sk?`cooldown ${f.sk}`:e?"~95 dmg · −20 HP":"44–60 · +30 en",!f.sk);
  a("heal",e?"Enhanced Heal":"Heal",f.hc?`cooldown ${f.hc}`:"big heal",!f.hc);
  if(!e)a("ultimate","Titan Overdrive","100 en · enhanced move",f.en>=100)}
 else if(c==="Emanator"){const z=f.bz;
  a("attack",z?"Berserk Strike":"Attack",z?"40–60 · +15 HP · +2 SP":"5–20");
  a("skill",z?"Berserk Skill":"Skill",z?"65–90 · −4 SP":f.sk?`cooldown ${f.sk}`:"15–30 · −35 HP · +3 core",z?f.sp>=4:!f.sk);
  a("heal","Heal",z?"52–82 · +3 SP":"24–39")}
 else if(c==="Genius"){a("attack","Attack","27–43 · +2 SP · +10 en");
  a("skill",f.ens?"Enhanced Skill":"Skill",f.ens?`×${(1+f.dm*.3).toFixed(1)} · −1 SP`:"39–47 · −1 SP · +1 DM",f.sp>=1);
  a("heal","Heal","54–66 · −1 SP",f.sp>=1);a("ultimate","Ultimate","50–65 · unlocks Enhanced",f.en>=100)}
 else if(c==="Demigod"){a("skill",f.und?"Royal Skill":"Sacrifice",f.und?"drain 34% · stacking":"drain 50% HP → charge");
  if(f.und){a("ultimate","Ultimate","heal 270 · reset stacks",f.en>=100);a("conquer","Conquer","100–130 dmg · heal 120",f.ch>=f.chMax)}}
 else if(c==="Archer"){
  if(f.lock){a("stop","Stop","end combo lock");a("skill",`Caladbolg ×${f.cm.toFixed(1)}`,"−2 SP · keep chaining",f.sp>=2)}
  else{a("attack","Attack","12–25 · +2 SP · +20 en");a("skill","Caladbolg II","−2 SP · enter Lock",f.sp>=2);a("heal","Heal","57–87 · −1 SP",f.sp>=1);a("ultimate","Blade Works","30–50 · +3 SP",f.en>=100)}}
 else if(c==="Knight"){a("attack","Attack","18–34 · +2 SP · +20 en");a("skill","Radiant Skill","28–48 · −1 SP",f.sp>=1);a("heal","Heal","52–90 · −1 SP",f.sp>=1);
  a("ultimate",f.en>=200?"Full Glory":"Charged Strike",f.en>=200?"120–160 · −200 en":"55–75 · −100 en",f.en>=100)}
 else if(c==="Gamer"){const oc=f.imm>0,mul=Math.pow(GLV,f.lvl);
  if(f.lvl>0)a("enhatk","Pac-Man Attack",`~${Math.round(17.5*mul+(oc?5+f.flat:0))} dmg (×${mul.toFixed(1)}) · heal 60–105 · LVL→0`);else a("attack","Tetris Shot",oc?"27–33 · +15 en":"17–23 · +15 en");
  a("skill","Level Up",oc?`+1 LVL · ×${GLV} · +5 flat`:`+1 LVL · ×${GLV} DMG bonus`,f.lvl<6);
  
  a("heal","Heal",f.hc?`cooldown ${f.hc}`:oc?"67–82 · cd 1":"30–45 · cd 1",!f.hc);
  a("ultimate","Overclock","100 en · 3-hit immunity",f.en>=100&&!oc)}
 else if(c==="Hemomancer"){const tb=(f.tgt&&f.tgt.hb)||0;
  a("attack","Lancet",`${HM.lan[0]}–${HM.lan[1]} · +1 bleed · +15 en`);
  a("skill","Rupture",f.sk?`cooldown ${f.sk}`:tb>=2?`${HM.rupB+HM.rupS*tb} dmg · eats ${tb} stacks`:"needs 2+ bleed stacks",!f.sk&&tb>=2);
  a("heal","Transfusion",f.hc?`cooldown ${f.hc}`:f.vit>=HM.vit?`${Math.floor(HM.heal[0]*HEALX)}–${Math.floor(HM.heal[1]*HEALX)} +${HM.healS*HEALX}/stack · −${HM.vit} Vitae`:`needs ${HM.vit} Vitae`,!f.hc&&f.vit>=HM.vit);
  a("ultimate","Crimson Eclipse","100 en · +3 bleed · ticks ×"+HM.ecl+" & heal",f.en>=100)}
 else if(c==="Champion"){const hr=f.mh;
  if(hr)a("attack","Enhanced Attack",`${CHM.enh[0]}–${CHM.enh[1]} · −${CHM.drain[0]}–${CHM.drain[1]} HP · −1 moon · +20 en`);else a("attack","Attack",`${CHM.atk[0]}–${CHM.atk[1]} · +15 en`);
  a("skill","Skill",hr?"sealed during the Hunt":f.sk?`cooldown ${f.sk}`:`${CHM.skl[0]}–${CHM.skl[1]} · +1 moon · +25 en`,!hr&&!f.sk);
  a("heal","Heal",f.hc?`cooldown ${f.hc}`:`${Math.floor(CHM.heal[0]*HEALX)}–${Math.floor(CHM.heal[1]*HEALX)} · +5 en`,!f.hc);
  a("ultimate","Raining Moonblades",`100 en · ${CHM.ult[0]}–${CHM.ult[1]} · +1 moon`,f.en>=100)}
 else if(c==="Trickster"){a("attack","Attack","27–36 · fills Stolen");a("skill","Steal",f.sk?`cooldown ${f.sk}`:"+5–10 Stolen · foe −10% dmg",!f.sk);a("heal","Heal",f.hc?`cooldown ${f.hc}`:"50–60 · cd 2",!f.hc);if(f.coins>0)a("spend","Spend Coins",`${f.coins}×30 dmg`)}
 return A}

/* returns true if the actor keeps the turn */
function DO(f,t,id){const c=f.cls,m=dm(f),h=hm(f),heal=n=>healF(f,n),H=(n,o)=>hit(f,t,n,o),cap=(k,mx)=>f[k]=cl(f[k],0,mx);
 if(c==="Titankin"){const e=f.enh;
  if(id==="attack"){let b=R(17,29)*m;if(e){b*=2;heal(15);f.enh=false}else f.en=cl(f.en+15,0,100);H(b,{res:1})}
  else if(id==="skill"){if(e){H(R(60,70)*1.5*m,{res:1});f.hp=Math.max(1,f.hp-20);f.enh=false}else{H(R(44,60)*m,{res:1});f.sk=5;f.en=cl(f.en+30,0,100)}}
  else if(id==="heal"){const n=heal(R(40,60)*h*1.1);L(`${f.name} heals ${n}`,"g");if(e)f.enh=false;else{f.hc=2;f.en=cl(f.en+15,0,100)}}
  else if(id==="ultimate"){f.en=0;f.enh=true;L("💥 Titan Overdrive! Choose an enhanced move.","a");return true}}
 else if(c==="Emanator"){const z=f.bz;
  if(id==="attack"){if(z){heal(10);f.sp=cl(f.sp+2,0,7);H(R(40,60)*m,{res:1})}else H(R(5,20)*m,{res:1})}
  else if(id==="skill"){if(z){f.sp-=4;heal(10);H(R(65,90)*m,{res:1})}else{f.hp=f.hp>35?f.hp-35:1;f.sk=2;f.core=cl(f.core+3,0,10);H(R(15,30)*m,{res:1})}}
  else if(id==="heal"){const n=heal(z?R(35,55)*h:R(16,26)*h);if(z)f.sp=cl(f.sp+3,0,7);L(`${f.name} heals ${n}`,"g")}}
 else if(c==="Genius"){const cr={cr:[.2,1.2]};
  if(id==="attack"){f.sp=cl(f.sp+2,0,3);f.en=cl(f.en+10,0,100);H(R(27,43)*m,cr)}
  else if(id==="skill"){f.sp--;if(f.ens){const x=R(45,50)*m*(1+f.dm*.3);f.dm=0;f.ens=false;H(x,cr)}else{f.dm=cl(f.dm+1,0,6);f.en=cl(f.en+20,0,100);H(R(39,47)*m,cr)}}
  else if(id==="heal"){f.sp--;f.en=cl(f.en+20,0,100);L(`${f.name} heals ${heal(R(36,44)*h)}`,"g")}
  else if(id==="ultimate"){f.en=0;f.ens=true;H(R(50,65)*m,cr);L("Enhanced Skill unlocked!","a")}}
 else if(c==="Demigod"){
  if(id==="skill"){if(f.und){const l=Math.floor(f.hp*.34);f.hp=Math.max(1,f.hp-l);f.ch=cl(f.ch+l,0,f.chMax);const x=R(26,34)*(1+f.st*.3);f.en=cl(f.en+35,0,100);f.st++;L(`−${l} HP drained`,"m");H(x)}

 if(n==="Archer"){const g=mk(n,"x");g.lock=true;g.sp=4;out.push(`<li class="gh">Combo Lock</li>`+L(acts(g)))}

 if(n==="Trickster"){const g=mk(n,"x");g.coins=3;out.push(`<li class="gh">With coins</li>`+L(acts(g)))}
 if(n==="Champion"){const g=mk(n,"x");g.en=100;g.mn=2;g.mh=true;out.push(`<li class="gh">Moonlight Hunt (2+ moons)</li>`+L(acts(g)))}
 if(n==="Hemomancer"){const g=mk(n,"x");g.vit=5;g.en=100;g.tgt={hb:4};out.push(`<li class="gh">With 4 bleed stacks on the target</li>`+L(acts(g)))}

function gRemnants(){const li=a=>a.map(x=>`<li>${x}</li>`).join("");

function audioSet(){const row=(k,l,v)=>`<label class="vr">${l}<input type="range" min="0" max="100" value="${Math.round(v*100)}" data-k="${k}"><b>${Math.round(v*100)}%</b></label>`;
 $("#app").innerHTML=`<div class="hud"><button class="btn" onclick="settingsMenu()">← Back</button><h2>Settings · Audio</h2><span></span></div>
 <div class="panel" id="au">${row("m","🎵 Music",VM)}${row("s","🔊 Effects",VS)}
 <div class="seg" style="margin-top:12px"><button class="btn ${MUS?"on":""}" id="aum">🎵 Music ${MUS?"on":"off"}</button><button class="btn ${MUTE?"":"on"}" id="aue">🔊 Effects ${MUTE?"off":"on"}</button></div></div>`;
 const au=$("#au");au.oninput=e=>{const k=e.target.dataset.k;if(k){setVol(k,e.target.value/100);e.target.nextElementSibling.textContent=e.target.value+"%"}};au.onchange=e=>{if(e.target.dataset.k==="s")sfx("heal")};
 $("#aum").onclick=()=>{setMus(!MUS);audioSet()};$("#aue").onclick=()=>{MUTE=!MUTE;try{localStorage.setItem("mute",MUTE?"1":"0")}catch(e){}audioSet()}}

const chips=(key,who,fn="setup")=>`<div class="pick cs">${["random",...NAMES].map(n=>{const k=CLS[n],on=S[key]===n,tk=fn==="rushSetup"&&n!=="random"&&rushTaken(key).includes(n);return`<button class="btn pk ${on?"on":""}" ${tk?"disabled title=\"Already picked for another slot\"":""} style="--c:${k?k.c:"var(--ac)"}" onclick="S.${key}='${n}';${fn}()">${on?`<i class="bd">${who}</i>`:""}<div class="mini">${k?art(n):'<div class="dice">🎲</div>'}</div><b>${k?n:"Random"}</b><small>${k?k.tag:"Surprise me"}</small></button>`}).join("")}</div><p class="lore">${S[key]==="random"?"Random picks any fighter when the battle starts.":`<b>${S[key]}</b> — ${LORE[S[key]]}`}</p>`;

 $("#app").innerHTML=`<div class="hud"><button class="btn" onclick="menu()">← Back</button><h2>Play Game</h2><span></span></div>
 <div class="panel"><label>Mode</label><div class="seg">${seg("mode","pvp","Player vs Player")}${seg("mode","ai","Player vs Bot")}</div>
 ${S.mode==="ai"?`<label>Bot difficulty</label><div class="seg">${seg("diff","normal","Normal 🤖")}${seg("diff","hard","Hard 💀")}</div>`:""}</div>
 <div class="duo"><div class="panel"><label>Your name</label><input type="text" id="n1" value="${S.n1}" placeholder="Player 1" oninput="S.n1=this.value"><label>${S.mode==="pvp"?"Player 1 fighter":"Your fighter"}</label>${chips("c1",S.mode==="pvp"?"P1":"YOU")}</div>
 <div class="panel">${S.mode==="pvp"?`<label>Player 2 name</label><input type="text" value="${S.n2}" placeholder="Player 2" oninput="S.n2=this.value"><label>Player 2 fighter</label>`:`<label>Bot fighter</label>`}${chips("c2",S.mode==="pvp"?"P2":"Bot")}</div></div>
 <div class="row"><button class="btn pri" onclick="startBattle()">⚔️ Fight</button></div>`}

 fight(p1,p2,{title:pvp?"PvP":"vs Bot",sub:pvp?"hot-seat":S.diff,hard:S.diff==="hard",pvp}).then(async w=>{if(!w)return;await ask(`<h2>🏆 ${w.name} wins!</h2><p class="q">“${TALK(w.cls,"win")}”</p><p style="color:var(--mu)">${w.cls} takes the arena.</p>`,["Rematch","Main menu"]).then(i=>i?menu():startBattle())})}

function storyRaw(){const f=n=>({id:n,n,ic:CLS[n].e,col:CLS[n].c,k:n}),b=k=>({id:k,n:BOSSES[k].n,ic:BOSSES[k].e,col:BOSSES[k].c,k:BCLS[k],emo:BOSSES[k].e});
return[
{id:"prologue",n:"Prologue",ic:"🌌",col:"#9b8cff",sub:"Before the Arena",t:"The Last Ascension",ln:["Titankin","Emanator","Genius"],p:[
`Before the Arena, there was a star that would not die. A god named Aeon built a throne upon it and a ladder to climb it, and he called the climb the <i>Ascension</i>: one champion, one crown, one hand strong enough to hold back the dark.`,
`Nine thousand worlds sent their best. The throne drank every one of them. Now the last world is burning, the ladder has a single rung left, and the Arena has dragged nine fighters out of the ruins to climb it.`,
`They do not know they were not chosen to win. They do not know who waits at the top. What follows is what each of them remembers, in their own voice, because the Arena could not silence them.`]},
{...f("Titankin"),sub:"The wall that stayed",t:"Titankin",ln:["saber","Knight"],p:[
`I do not remember the Furiae wars as battles. I remember them as one long night I refused to end. When the first star fell on my city, I was told to run. I put my back to the gate instead.`,
`The Queen pressed her blade to my shoulder and gave me one word for an oath: <i>Hold.</i> So I held. Cities burned behind me. My brothers became monuments. I became the wall that stayed.`,
`Then the Queen came back through that same gate wearing black, bleeding red, and she did not know my face. I did not strike her. I have not stopped holding since.`,
`Hit me. Hit me again. Stone does not forgive, and neither does an oath, but both endure. Something in this Arena is waiting for the wall to break. It will wait a very long time.`]},
{...f("Emanator"),sub:"The last word of the Sun",t:"Emanator",ln:["Genius","lord","Archer"],p:[
`I am not a man. I am the last thing the Sun said before it went quiet. Aeon cut a seed from the dying star and sealed it inside a body to keep it from the dark, and that body woke up screaming.`,
`Every blow I take feeds the Core. Every wound remembers what burning feels like, and when the Core is full, the Sun remembers it is a star. They call it Berserk. I call it breathing.`,
`The Genius says I am a coordinate in her equation. The Archer says I am the mark at the end of her chain. I know what I am. I am a fuse.`,
`The Lord wants to swallow me because I am proof the light was ever real. I intend to disappoint him. Slowly, and then very loudly, with meteors.`]},
{...f("Genius"),sub:"The proof that cannot be unwritten",t:"Genius",ln:["Demigod","Trickster","Gamer"],p:[
`I solved the universe at nineteen. It took eleven pages and one line I refused to read twice: <i>entropy wins.</i> I have spent a century trying to prove myself wrong.`,
`The Arena is the only machine that does not obey my proof. It feeds on a variable I cannot model: someone choosing to lose. I stack dark matter one term at a time, and when the last term aligns I will deliver the one perfect solution.`,
`But I cannot compute the Demigod's sacrifice. I cannot compute the Trickster's coin. I cannot compute why the Gamer keeps whispering that the numbers above our heads are a game.`,
`If I am right, the Lord is the only honest being in this place. If I am wrong, I have been very, very expensive to be wrong.`]},
{...f("Demigod"),sub:"The heir who will not sit",t:"Demigod",ln:["lord","Genius","saber"],p:[
`My father built the throne. I was his last mistake. Every piece of myself I give the Arena, it returns as charge, glory, the shape of a god. At one hundred and fifty the crown closes, and I become the Undying King.`,
`I have read the founding stones. I know what the first Undying King became, and I know his name, because he was my brother. The throne did not crown him. It burned him, and he decided to burn it back.`,
`So I pay in blood and keep a little back. Every ascension I stop one step short of the seat. They call it hesitation.`,
`It is the only thing that has ever stopped the cycle. I will walk to the very end, and I will tell my brother what our father said before he died: <i>I am sorry.</i>`]},
{...f("Archer"),sub:"The hunter at the end of every world",t:"Archer",ln:["lord","Trickster","Emanator"],p:[
`Nobody agrees on what I hunt. I hunt the thing that arrives one breath before the end. I have crossed nine thousand dead worlds on a chain of my own arrows, and in every ash field there was a bow-shaped hole where someone stood, too late, attempting the same shot.`,
`I stopped counting how many times I reached him. Now I can hold him still. One Lock, one breath between heartbeats, and every arrow I loose inside it stacks on the last.`,
`The Knight asks why I never aim at the Queen. The Queen is not my target. The thing standing behind her is.`,
`And the Trickster keeps asking me for a coin. I keep asking why he is afraid of me.`]},
{...f("Knight"),sub:"The First Sword of the Dawn Court",t:"Knight",ln:["saber","Titankin"],p:[
`I was the Queen's First Sword. Not her strongest, because she had no equal. I was the one she trusted to carry her blade when the night grew long.`,
`When she drank from the Arena's grail to save her people, the light went out of her and the black came in. I was ordered to end her if that ever happened. I wrote the order myself.`,
`In every duel I build the light I swore to return. The first surge is mine. The second, the Full Glory, is hers, and I feel her hand over my hand on the hilt.`,
`I have seen her wear black, and bleed red, and still hold her sword exactly the way I taught her. The Arena wants me to fail. So I will not only kill my Queen. I will bring her home.`]},
{...f("Trickster"),sub:"The thief who steals fate",t:"Trickster",ln:["devourer","Archer"],p:[
`Let me lie to you honestly. I steal. A coin from the Devourer's pocket. A breath from an enemy's counterattack. Ten percent of a monster's rage. Every coin in my bag is a second of someone else's luck, and the Devourer wants every one of them back.`,
`The funny part is that his coin has two faces and mine has only the one I need. I replaced the other with a mirror. That is why he cannot stop losing to me.`,
`When the Archer finally corners me, I will tell him where I really got it. Not yet. A good thief never gives away the story before the heist is finished.`,
`And a word of advice: in this Arena, everyone is waiting for the right moment to take something that is not theirs. I am simply the only one who admits it.`]},
{...f("Gamer"),sub:"The player who read the rules",t:"Gamer",ln:["devourer","Genius","lord"],p:[
`I woke up with a number over my head. Level one. Everyone here thinks they are living in a story. I am living in a system. The Arena has cooldowns, energy bars, three phases for every boss. I counted.`,
`Somebody wrote these rules, and rules can be read. Every level I earn rewrites a little of the code. The Tetris Shot. The Pac-Man bite that heals what it eats. Overclock, when the world gets too heavy to hit me.`,
`The Genius calls it cheating. It is the only honest way to play a game you never agreed to enter.`,
`One thing in here is not scripted: the Devourer's coin. It lands however it likes. That terrifies me. It is also the most beautiful thing I have ever seen. Level 999 is not a cap. It is a promise.`]},
{...f("Hemomancer"),sub:"The physician who learned to bleed a queen",t:"Hemomancer",ln:["saber","Knight","seamstress"],p:[
`I was the Dawn Court's physician, and I kept one rule: a wound is a door. Open it carefully and the body tells you everything. I read blood the way the Genius reads proofs, and I loved the Queen the way a physician is allowed to, quietly and with clean hands.`,
`The night she drank from the grail, I held her wrist. Her blood went black under my fingers, and it was <i>listening</i>. The corruption was not in her veins. It was her veins. I could not cure it. So I did the only thing a physician can do when the cure is impossible: I learned to bleed it out, one cut at a time.`,
`They call it hemomancy now. I call it patience. Every Lancet is a question. Every stack of red is a wound that remembers the last one. Rupture is what happens when the body finally answers, and the Transfusion is the Arena paying me back, a little, for every life I opened to learn it.`,
`The Seamstress sews what the dead leave behind. I open what the living are afraid to look at. We will never be friends. But when the Queen's blade comes down, I want to be close enough to catch her, with my hands already red.`]},
{...f("Champion"),sub:"The sword that tied the moon behind a blindfold",t:"Sword Champion",ln:["Hemomancer","saber","unwritten"],p:[
`I was the Dawn Court's last sword champion. I never lost a duel, and I never needed to hate anyone to win one. The blade was quiet and so was I. That was the whole art.`,
`Then the star began to die, and the moon came down close enough to touch. Under it, the blade stopped being quiet. I heard it ask a very simple question, and the answer was always the same: more. I tied a strip of black cloth over my eyes the night I almost answered it.`,
`Now I walk through the Arena calm and silent, because calm is the only cage I have left. Each time the moon opens in me, the cloth comes off, and what looks out is not a champion. It is hunger with a sword. Every cut I make costs me blood, and some of that blood, I am ashamed to say, I enjoy.`,
`The Hemomancer says there is a cure for a wound that listens. I say a wound is only a door. Someday someone will stand in front of me who can close it. Until then: silence, please. I am trying very hard not to think about bloodshed.`]},
{...b("saber"),sub:"Boss · The Pale Queen",t:"Alter Saber",ln:["Knight","Titankin"],p:[
`They say the grail lies. It does not. It grants wishes exactly. I wished to protect my kingdom from every enemy it would ever face, and the grail showed me the only way: become the enemy.`,
`So I became it. A black blade. A red crown. Corruption in every breath, left behind on the ground so my foes bleed even when I am not near.`,
`I know the Knight is coming. I know the Titan still holds the gate I told him to hold. I do not hate them. I never stopped being their Queen. I only stopped being able to stop.`,
`If any of you want to save me, hit harder than I can bleed, and do not look away when the dark sword falls.`]},
{...b("devourer"),sub:"Boss · The Court Jester",t:"Fun Devourer",ln:["Trickster","lord","Gamer"],p:[
`Ha ha ha. Do you know what happens when a god dies laughing? Someone has to eat the laugh. I was the court jester, and I had the biggest mouth, so: me.`,
`Now I am a head and a pair of hands and a very large appetite. I flip a coin for every guest. Heads, you break. Tails, I bleed. Either way, the house enjoys the show.`,
`I eat joy. I eat hope. I eat luck, and the Trickster's best jokes. The Lord promised me my body back. The Lord lies. I love him for it.`,
`Here is the punchline, free of charge: nobody wins this. The throne is the house, and the house always wins. Oh, I am not afraid. I just like to see who flinches.`]},
{...b("lord"),sub:"Boss · The First Ascendant",t:"Lord Destruction",ln:["Demigod","Emanator","Archer"],p:[
`I was the first to win. I climbed my father's ladder with my bare hands and sat on his throne, and the throne began to burn me from the inside. That was when I understood the whole joke.`,
`The Ascension does not choose a champion. It chooses fuel. Nine thousand worlds fed to one star, so one more king could burn for a few more ages. I tried to be kind about it. I tried for a thousand years.`,
`Then I stood up and began taking the throne apart. You call it destruction, little brother. I call it the last mercy left.`,
`Come and hit me. Every black hole I make is a door out of the cycle. Open one.`]},
{id:"echo-Titankin",pt:"Echoes",ghost:1,k:"Titankin",n:"Gate Brother",ic:"🕯️",col:CLS.Titankin.c,sub:"Echo · Titankin's support · +4 SP to both",t:"The Brother at the Left Gate",ln:["Titankin","saber"],p:[
`Little brother, you hold the right gate. I hold the left. That was the whole plan. When the star fell the left door buckled, and I went through it before the fire did. You were across the wall shouting my name, and I am sorry I could not answer.`,
`You were always the one who could keep standing. I only kept up. So here is the last thing I have. Four breaths of strength from a brother who is a statue now.`,
`Do not turn around. Hold.`]},
{id:"echo-Gamer",pt:"Echoes",ghost:1,k:"Gamer",n:"Player Two",ic:"🕯️",col:CLS.Gamer.c,sub:"Echo · Gamer's support · 3-hit immunity",t:"Player Two",ln:["Gamer","devourer"],p:[
`Hey. Co-op was my idea, remember? You never learned to block, so I learned for both of us. The servers went dark at midnight, and I was not about to let your save file corrupt too.`,
`Three hits. That is all the shield I have left. I counted. Please do not waste them on the tutorial boss. I know you will.`,
`I love you anyway. Press start. Press start, you absolute noob.`]},
{id:"echo-Demigod",pt:"Echoes",ghost:1,k:"Demigod",n:"The Healer",ic:"🕯️",col:CLS.Demigod.c,sub:"Echo · Demigod's support · big heal",t:"The Mortal Mother",ln:["Demigod","lord"],p:[
`They called me the god's mistake, too. A healer from a village with no name, singing to a baby with a star in his chest. I knew what you were from the first night. I sang anyway.`,
`When the Furiae reached our door I had one song left and nothing to sing it with, so I sang it with everything I was. If your wounds close, it is only the lullaby.`,
`I am not strong, my love. I am only mortal. That was always the power.`]},
{id:"echo-Genius",pt:"Echoes",ghost:1,k:"Genius",n:"The Professor",ic:"🕯️",col:CLS.Genius.c,sub:"Echo · Genius's support · damage buff to all",t:"The Last Coefficient",ln:["Genius","Emanator"],p:[
`Child, you proved me wrong at nineteen, and I have never been happier. I spent forty years on one theorem, and you ended it in eleven pages.`,
`I did not die of despair, whatever the others say. I died of a good idea: that the number at the end of your proof was not zero. I left it in the margin.`,
`Multiply by anything you love. It will not be zero. This is my last coefficient. Use it.`]},
{id:"echo-Trickster",pt:"Echoes",ghost:1,k:"Trickster",n:"Mirra",ic:"🕯️",col:CLS.Trickster.c,sub:"Echo · Trickster's support · boss damage to 70%",t:"The Best Liar",ln:["Trickster","lord","devourer"],p:[
`You always said I was the better liar. I proved it on the biggest mark of all: I sold the Lord a map. A false one. Every wrong turn costs him a third of his rage.`,
`I would have told you the plan, but you would have tried to take my place, and you were never that good a thief. The coin you carry was mine first. Do not give it back to the Jester.`,
`Oh, and I am the mirror on the other side of the coin. Obviously. Tell them I was the best, and say it with a straight face.`]},
{id:"echo-Knight",pt:"Echoes",ghost:1,k:"Knight",n:"The Squire",ic:"🕯️",col:CLS.Knight.c,sub:"Echo · Knight's support · less damage taken, 5 turns",t:"The Squire's Shield",ln:["Knight","saber"],p:[
`Sir, you left your shield at the keep again. I brought it. Sorry I am late. The road was on fire. I am eleven, and I do not think I am supposed to be here.`,
`The Queen smiled at me once. I would like to carry her banner a little further, if that is all right. If I fall, will you tell her I did not drop it?`,
`Here. It is heavier than it looks. It holds five heartbeats of the whole world pushing back.`]},
{id:"echo-Emanator",pt:"Echoes",ghost:1,k:"Emanator",n:"Six Sparks",ic:"🕯️",col:CLS.Emanator.c,sub:"Echo · Emanator's support · meteor strike",t:"The Six Sparks",ln:["Emanator","lord"],p:[
`Seven seeds were cut from the Sun. One became you. Six of us went into the dark as embers with no bodies, and we have been falling for a very long time.`,
`We are not sad. We are late. Call us and we will arrive the way we always wanted to: brightly, all at once, and aimed at someone who deserves it.`,
`It is not dying, brother, if you are falling toward home.`]},
{id:"echo-Archer",pt:"Echoes",ghost:1,k:"Archer",n:"Tidewatcher",ic:"🕯️",col:CLS.Archer.c,sub:"Echo · Archer's support · stuns the boss",t:"One Breath",ln:["Archer","Trickster"],p:[
`You never asked why the Salt Tide stopped, Archer. The truth is that I did not stop it. I held the sea open for one breath so you could cross. A breath is all anyone gets, and I spent mine on you.`,
`When the monster comes, I will be that breath again. Hold the string. Look at me when you let go.`,
`I will be in the pause between the arrow and the sound.`]},
{id:"echo-Hemomancer",pt:"Echoes",ghost:1,k:"Hemomancer",n:"Ward Nine",ic:"🕯️",col:CLS.Hemomancer.c,sub:"Echo · Hemomancer's support · the boss bleeds ×4",t:"What the Ward Remembers",ln:["Hemomancer","saber"],p:[
`We were nine rows of beds in the Dawn Court infirmary, and you walked between us every night with a basin and a lantern. You never told us which of us would not wake. You only asked us to be brave about the cutting.`,
`We remember that you never flinched. We remember copper and lavender, and your voice counting. Blood remembers who was kind to it.`,
`So when you call, we answer the only way the dead can. We open the door you could not close, and we let the dark run out of whatever stands in front of you.`]},
{id:"echo-Champion",pt:"Echoes",ghost:1,k:"Champion",n:"The Snowfield Duel",ic:"❄️",col:CLS.Champion.c,sub:"Echo · Champion's support · +50 energy to all players",t:"What the Snow Remembers",ln:["Champion","Hemomancer"],p:[
`We were the ones who lost to you, one winter at a time. You bowed after every cut, and the snow took our names so gently that we thanked it.`,
`We remember how quiet you were, the quietest blade the Court ever knew. We remember you were never cruel. The moon is cruel, and it is wearing your face.`,
`So when you call, we come back as the one thing we still have: cold, clear light, poured into everyone who stands beside you. Take it. Fight calmly. Stay yourself.`]},
{id:"calamities",pt:"Secrets",col:"#c9c3d6",ic:"☠️",n:"Calamities",sub:"The Archivist records",t:"The Old Calamities",ln:["Titankin","Archer","below"],p:[
`Long before the Ascension, the dark had names. The <b>Furiae</b>, a war born when the Sun first flared in anger. The <b>Quiet</b>, which unmade sound, then memory, then those who might have remembered it.`,
`The <b>Salt Tide</b>, which turned seas into graveyards and cities into crystal. The <b>Hollow Dawn</b>, the first sunrise that gave no light.`,
`Aeon sealed them one by one and built the Arena on the lid. Four seals, for four calamities. That was the plan. The Arena holds five.`]},
{id:"cradle",pt:"Secrets",col:"#ff8fb1",ic:"🔨",n:"The Cradle",sub:"A new calamity",t:"The Cradle",ln:["epilogue","seamstress","unwritten"],p:[
`Beneath the throne, something is hammering. Not iron. Something older, a forge that burns on grief. For three Ascensions the walls have been missing their dead: a brother's last breath, a partner's last lie, a mother's last song.`,
`The Echoes are not fading. They are being harvested. Someone is melting down the final words of the dead, the ash of nine thousand worlds and a thief's stolen luck, and casting them into a cradle.`,
`They are building a god. Not a king. Not a throne. A god with no father, for children who have not been born yet. By the time it wakes, none of you will have a name.`]},
{id:"unwritten",pt:"Secrets",col:"#e8e4f0",ic:"🃏",n:"The Unwritten",sub:"Fighters with no names",t:"The Unwritten",ln:["cradle","Archer","seamstress"],p:[
`Five figures have been seen at the edge of the Arena, in places no fighter was invited. A girl in a white mask who stops mid-step to listen to something no one else can hear. A man whose shadow walks half a second behind him.`,
`A child who counts the Arena's heartbeats and has never been wrong. A swordsman whose blade is only the idea of a blade. And one who appears in no record, yet every fighter remembers fondly, though none can say where they met.`,
`They have no names. The Archivist's pen skips when it tries to write them. Each carries a mark on the palm: a blank page. These are the ones the Cradle is for.`]},
{id:"seamstress",pt:"Secrets",col:"#ffd36b",ic:"🪡",k:"BSeam",emo:"🪡",n:"The Seamstress",sub:"Boss · The Cradle’s Mother",t:"She Who Sews",ln:["cradle","devourer","unwritten"],p:[
`She has no name, only a needle. The fighters who see her do not describe a face. They describe the sound of thread.`,
`She sits in the Cradle's dark and stitches the stolen Echoes into a body: a shoulder from a brother's courage, a voice from a mother's lullaby, a laugh from a jester's stolen mirth. She is not cruel. She is a mother in a very old, very quiet way, and every stitch is a promise.`,
`The Lord has never met her. The Jester has, and he went silent for a year.`]},
{id:"below",pt:"Secrets",col:"#19d3c5",ic:"🌊",k:"BBelow",emo:"🌊",n:"The One Below",sub:"Boss · the fifth seal",t:"What the Deep Remembers",ln:["lord","Archer","aeon"],p:[
`Under the Cradle sleeps the fifth seal, the one Aeon never named because he could not bear to. In the first ages it was a door that answered every question with the same word. When the star began to die, the door opened, and the door was never a door. It was a mouth.`,
`What came up through the Cradle was teal and vast and older than the throne: a leviathan the old songs called <i>The One Below</i>. It does not hunt. It remembers. Every wound it deals leaves a mark, a thread of its own cold light tied around a name, and a name that carries two marks is a name it bites in half.`,
`Lord Destruction knocks on its scales every night, certain it leads out. The Seamstress stitched the Cradle shut over its first breath and says the thread still hums. The Archer's chain runs straight into its throat, and in every dead world he walked, the ash lay arranged around it like a prayer.`,
`When it roars, the whole Arena forgets how to move. The sound is not anger. It is a question, asked in a voice the size of an ocean, and the only wrong answer is to stand still and be counted.`]},
{id:"aeon",pt:"Secrets",col:"#ffd36b",ic:"✉️",n:"Aeon's Letter",sub:"Found beneath the throne",t:"To My Sons",ln:["lord","Demigod","below"],p:[
`My sons. If you are reading this, one of you has found the lie and the other has refused to sit. Good.`,
`I built the throne to hold back the dark, and I was wrong, because the dark was never outside. It was the weight of being the only one. I wanted a god strong enough to carry the world. I should have built a world strong enough to carry its god.`,
`The fifth seal is not a calamity. It is a question. Do not let anyone answer it for you.<br><i>— Aeon</i>`]},
{id:"lasthour",pt:"Apocalypse",col:"#ff4b2b",ic:"☄️",n:"The Last Hour",sub:"Apocalyptic Boss Rush",t:"When the Sky Cracks",ln:["clock","below","aeon"],p:[
`On the night the Arena first bled into the sky, nine fighters looked up and saw a clock with no numbers. It had only hands, and the hands were made of cracks.`,
`Every Ascension the star burns a little lower. The Archivist calls this the Last Hour. It is not a day. It is the stretch of time between a world's final choice and the moment it learns what that choice cost.`,
`Bosses who walk in the Last Hour are not stronger. They are finished: they have stopped fearing the end, so they stop holding back. The Seamstress calls it mercy. The Lord calls it punctuality.`]},
{id:"clock",pt:"Apocalypse",col:"#ff7a3d",ic:"⏳",n:"The Doomsday Clock",sub:"Four strikes, repeating",t:"Meteor, Ash, Sun, Silence",ln:["lasthour","lord","seamstress"],p:[
`Meteor Rain. Ashfall. The Black Sun. The Silence of the End. The old texts name four strikes and say they repeat while any fighter still stands.`,
`Each strike is a memory the world refuses to lose. The meteors are the first stars Aeon lit. The ash is every city the Furiae burned. The Black Sun is the day the throne was built. The Silence is the sound of the last prayer, when nobody was left to answer it.`,
`Those who survived the clock say there is a trick to it. You cannot outrun it and you cannot outlast it. You can only be standing when it stops.`]},
{id:"epilogue",pt:"Secrets",n:"Epilogue",ic:"🌅",col:"#ffb454",sub:"The door at the top",t:"Ascend or End",ln:["Demigod","Emanator","Knight"],p:[
`The Arena listens. When the last voice falls silent it opens a door and offers the survivor everything: the Sun, the throne, a god's name.`,
`Some will take the crown. Some will burn it. One will ask the throne a question it has never been asked: <i>what if no one sits?</i>`,
`Nobody has ever answered. Beneath the throne, a hammer is still falling: someone is building the answer before the question is asked. Every duel, every boss, every Ascension begins the same way. Someone steps forward, and the dark leans in to listen.`]}]}
function story(id){if(id)STY=id;const D=storyData(),i=Math.max(0,D.findIndex(c=>c.id===STY)),c=D[i],pv=D[i-1],nx=D[i+1];
 $("#app").innerHTML=`<div class="hud"><button class="btn" onclick="menu()">← Back</button><h2>📖 Lore</h2><span style="color:var(--mu);font-size:12px">${i+1} / ${D.length}</span></div>
 <div class="chrow">${["Voices","Echoes","Secrets","Apocalypse"].map(q=>`<button class="btn ${c.pt===q?"on":""}" style="font-size:14px" onclick="story('${D.find(z=>z.pt===q).id}')">${{Voices:"🎭",Echoes:"🕯️",Secrets:"🔮",Apocalypse:"☄️"}[q]} ${q}</button>`).join("")}</div><div class="chrow">${D.filter(z=>z.pt===c.pt).map(x=>`<button class="btn ${x.id===c.id?"on":""}" style="--c:${x.col}" onclick="story('${x.id}')">${x.ic}</button>`).join("")}</div>
 <div class="panel lorebox" style="--c:${c.col};border-color:${c.col}">${c.k?`<div class="${c.ghost?"ghost":""}">${charHTML(c.k,c.col,c.emo)}</div>`:`<div class="lbig">${c.ic}</div>`}<p class="lsub">${c.sub}</p><h2 class="lt">${c.t}</h2>
 ${c.p.map((x,j)=>`<p class="${j?"":"lp1"}">${x}</p>`).join("")}
 <div class="lln"><small>Their paths cross</small>${c.ln.map(id=>{const o=D.find(z=>z.id===id);return`<button class="btn" style="--c:${o.col}" onclick="story('${id}')">${o.ic} ${o.n}</button>`}).join("")}</div></div>
 <div class="row">${pv?`<button class="btn" onclick="story('${pv.id}')">← ${pv.n}</button>`:""}${nx?`<button class="btn pri" onclick="story('${nx.id}')">${nx.n} →</button>`:`<button class="btn pri" onclick="menu()">Enter the Arena</button>`}</div>`;window.scrollTo(0,0)}
function howto(){$("#app").innerHTML=`<div class="hud"><button class="btn" onclick="menu()">← Back</button><h2>Rules &amp; Bot</h2><span></span></div>
 <div class="panel"><h3>Basics</h3><ul><li>Fighters start at 300 HP and trade turns. Reduce the other fighter to 0 to win.</li><li>Cooldowns tick down at the end of each of your turns.</li><li>Colored bars: green HP, cyan Energy, purple SP, plus a special bar per class (Core, Charge, DM, Stolen, Coins).</li><li>Crit and parry chances are per class (Titankin, Genius, Archer).</li></ul></div>
 <div class="panel"><h3>Bot</h3><ul><li><b>Normal:</b> heals under 35% HP, uses ultimates and skills often, spends coins at 2+.</li><li><b>Hard:</b> heals earlier (45%), skills 80% of the time, pushes Archer combos longer, hoards Trickster coins until 3.</li><li>Every class has its own chatter bubbles.</li><li><b>Gamer Bot:</b> Levels up every turn (up to LVL 6 (shown as LVL 999)) and fires Overclock as soon as it has any LVL, so the immunity covers its stacking. It cashes in the Pac-Man Attack at the LVL cap or for a lethal hit, heals under 30% HP, and uses Pac-Man as a backup heal when Heal is on cooldown.</li></ul></div>
 <div class="panel"><h3>Campaign</h3><ul><li>Each floor is a domain: an Enemy, an Elite, then a Boss of a random class (all nine before repeats).</li><li>After each win you pick a buff: +5% HP, +5% heal or +5% damage.</li><li>After a boss you may adopt its class. Enemies grow every floor: damage ×1.08, heal ×1.03, HP ×1.04.</li><li>Each wave randomly decides who strikes first.</li></ul></div>
 <div class="panel"><h3>Boss Rush &amp; Apocalyptic</h3>${gRush}</div>${gApoc}`}

/* ===== campaign ===== */
function campSetup(){if(svGet("camp")){svPrompt("camp");return}$("#app").innerHTML=`<div class="hud"><button class="btn" onclick="menu()">← Back</button><h2>Campaign</h2><span></span></div>
 <div class="panel"><label>Your name</label><input type="text" id="cn" value="${S.n1}" placeholder="Hero" oninput="S.n1=this.value"><label>Starting class</label>${chips("c1","YOU","campSetup")}</div><div class="row"><button class="btn pri" onclick="campaign()">🗺️ Begin</button></div>`}
async function buff(p){const i=await ask(`<h2>Choose a buff</h2><p>Permanent for this run.</p>`,[`❤️ +5% max HP <small>(now ×${B.hp.toFixed(2)})</small>`,`💚 +5% healing <small>(now ×${B.heal.toFixed(2)})</small>`,`⚔️ +5% damage <small>(now ×${B.dmg.toFixed(2)})</small>`]);
 sfx("buff");if(i===0)B.hp*=1.05;else if(i===1)B.heal+=.05;else B.dmg+=.05}
var RUNMODE=null,CK=null;
const svKey=m=>"aoa_save_"+m;
function snapF(f){try{return JSON.parse(JSON.stringify(f,(k,v)=>(k==="tgt"||k==="PL"||k==="SUP")?undefined:v))}catch(e){return null}}
function svGet(m){try{return JSON.parse(localStorage.getItem(svKey(m)))}catch(e){return null}}
function svDel(m){try{localStorage.removeItem(svKey(m))}catch(e){}}
let svBusy=false;
async function leave(){
 if(!RUNMODE||!CK){menu();return}
 if(svBusy)return;svBusy=true;
 const i=await ask(`<h2>Leave the battle?</h2><p>Save your progress to continue later, or discard this run.</p>`,["💾 Save progress","🗑️ Don't save","Cancel"]);
 svBusy=false;
 if(i===2)return;
 if(i===0){try{localStorage.setItem(svKey(CK.mode),JSON.stringify(CK))}catch(e){}}
 menu()}
function svPrompt(m){
 const d=svGet(m);if(!d){return}
 const info=m==="camp"?`Floor ${d.rnd} · ${["Enemy","Elite","Boss"][d.s]} · ${d.bc} Domain<br><small style="color:var(--mu)">${d.name} the ${d.cls}</small>`:`${d.all?`Boss ${d.i+1} of ${d.list.length}`:"Single boss"} · ${(BOSSES[d.list[d.i]]||BELOWD).n}<br><small style="color:var(--mu)">${d.ap?"Apocalyptic":"Normal"} · ${d.cls[0]} + ${d.cls[1]} · Support ${d.sup}</small>`;
 $("#app").innerHTML=`<div class="hud"><button class="btn" onclick="menu()">← Back</button><h2>Saved run</h2><span></span></div><div class="panel"><label>${m==="camp"?"Campaign":"Boss Rush"} · saved progress</label><h3 style="margin:6px 0">${info}</h3><p class="lore">Continue restores the battle exactly where you left it: HP, bars, cooldowns, effects and whose turn it is. Starting over discards this save.</p></div><div class="row"><button class="btn pri" onclick="svGo('${m}',1)">▶ Continue battle</button><button class="btn" onclick="svGo('${m}',0)">🔄 Start over</button></div>`}
function svGo(m,c){const d=svGet(m);svDel(m);if(c&&d){if(m==="camp")campaign(d);else startRush(d)}else{if(m==="camp")campSetup();else rushSetup()}}
const CAMP={dmg:1.08,heal:1.03,hp:1.04};
async function campaign(r0){B={dmg:1,heal:1,hp:1};E={dmg:1,heal:1,hp:1};cycle=[];let rnd=1,p=mk(pickC(S.c1),S.n1.trim()||"Hero",false),dead=false;if(r0){B=r0.B;E=r0.E;cycle=[...r0.cycle];rnd=r0.rnd;p=mk(r0.cls,r0.name,false)}
 while(!dead){if(!r0&&!cycle.length)cycle=[...NAMES].sort(()=>Math.random()-.5);const bc=r0?r0.bc:cycle.shift(),[n1,n2]=ENEMY[bc],k=CLS[bc];
  if(!r0)await ask(`<h2>Floor ${rnd}</h2><p>${k.e} ${bc} Domain</p><p style="color:var(--mu)">${n1} · ${n2} · ${bc} Boss<br>Enemy ×${E.dmg.toFixed(2)} dmg · ×${E.hp.toFixed(2)} HP</p>`,["Enter"]);
  const stages=[()=>mkSimple(n1,Math.floor(150*B.hp*E.hp),[10,30],[20,30],null,k.c,k.e),
   ()=>{const e=mkSimple(n2,Math.floor(180*B.hp*E.hp),[10,30],[20,35],[30,40],k.c,k.e);e.elite=true;return e},
   ()=>{const b=mk(bc,bc+" Boss",true);b.maxHp=b.hp=Math.floor(Math.floor(Math.floor(300*E.hp)*E.hp)*(1+(rnd-1)*.15));return b}];
  for(let s=r0?r0.s:0;s<3;s++){const rfs=r0?r0.fs:null;r0=null;CK={mode:"camp",rnd,cls:p.cls,name:p.name,cycle:[...cycle],bc,s,B:{...B},E:{...E},fs:rfs};RUNMODE="camp";resetF(p);const e=stages[s](),w=await fight(p,e,{title:`Floor ${rnd} · ${["Enemy","Elite","Boss"][s]}`,sub:`DMG ×${B.dmg.toFixed(2)} HP ×${B.hp.toFixed(2)}`,hard:true,boss:s===2,resume:rfs,snap:x=>{if(CK)CK.fs=x},first:chance(.5)?"a":"b"});
   if(!w)return;if(w!==p){dead=true;break}solari([[10,15],[15,20],[30,50]][s]);fragGain([p.cls],[[1,7],[5,10],[8,15]][s]);if(s===2)fragGain([bc],[20,20]);
   if(s===2){await buff(p);if(await ask(`<h2>Adopt ${bc}?</h2><p>${k.e} ${CLS[bc].tag}</p>`,["Yes, be reborn","Keep my class"])===0){p=mk(bc,p.name,false)}}else await buff(p)}
  if(dead)break;await ask(`<h2>Domain cleared!</h2><p>Enemies grow stronger…</p>`,["Next floor"]);
  B.hp+=.1;rnd++;E.dmg*=CAMP.dmg;E.heal*=CAMP.heal;E.hp*=CAMP.hp}
 await ask(`<h2>💀 Campaign over</h2><p>${p.name} the ${p.cls}<br>Floors cleared: ${rnd-1}<br>DMG ×${B.dmg.toFixed(2)} · Heal ×${B.heal.toFixed(2)} · HP ×${B.hp.toFixed(2)}</p>`,["Main menu"]);menu()}
menu();
</script>
